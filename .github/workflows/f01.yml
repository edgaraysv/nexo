name: Nexo baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            product/portal/package-lock.json
      - run: npm ci --workspaces=false --ignore-scripts
      - name: Install portal dependencies from its lockfile
        run: npm ci --prefix product/portal --workspaces=false --ignore-scripts
      - name: Typecheck the portal workspace
        run: npm run typecheck --workspace=product/portal
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: product/agent/go.mod
          cache-dependency-path: product/agent/go.sum
      - run: go test ./...
        working-directory: product/agent
      - run: go vet ./...
        working-directory: product/agent
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: spikes/api/go/go.mod
          cache-dependency-path: spikes/api/go/go.sum
      - run: go test ./...
        working-directory: spikes/api/go
      - run: go vet ./...
        working-directory: spikes/api/go
      - run: npm run verify
      - name: Archive the tagged source tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release/source
          git archive --format=tar.gz --prefix="nexo-${GITHUB_REF_NAME}/" "$GITHUB_SHA" > release/source/nexo-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nexo-source
          path: release/source/nexo-source.tar.gz
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces=false --ignore-scripts
      - name: Create isolated disposable databases for each migration profile
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexo_ci
        run: |
          node --input-type=module -e '
            import { Client } from "pg";
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              for (const database of ["nexo_f09", "nexo_f10", "nexo_f08", "nexo_ga01"]) {
                await client.query(`CREATE DATABASE "${database}"`);
              }
            } finally {
              await client.end();
            }
          '
      - name: Apply F09 profile and verify idempotent replay in its own database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexo_f09
        run: |
          npm run db:migrate -- --profile f09-local --initialize
          npm run db:migrate -- --profile f09-local
          node scripts/check-migration-history.mjs f09-local
      - name: Apply F10 migrations 020/021 in an independent database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexo_f10
        run: |
          npm run db:migrate -- --profile f10-local --initialize
          npm run db:migrate -- --profile f10-local
          node scripts/check-migration-history.mjs f10-local
      - name: Apply F08 profile, including 016, in its own database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexo_f08
        run: |
          npm run db:migrate -- --profile f08-local --initialize
          npm run db:migrate -- --profile f08-local
          node scripts/check-migration-history.mjs f08-local
      - name: Apply GA-01 only to its own disposable database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexo_ga01
        run: |
          npm run db:migrate -- --profile ga01-local --initialize
          npm run db:migrate -- --profile ga01-local
          node scripts/check-migration-history.mjs ga01-local
      - name: Reject mixing F08/016 into GA-01 without changing either profile history
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexo_ga01
        run: |
          if npm run db:migrate -- --profile f08-local; then
            echo 'Expected the runner to reject migration-profile mixing.' >&2
            exit 1
          fi
          node scripts/check-migration-history.mjs ga01-local
      - run: docker pull postgres:17.6-bookworm
      - run: npm run build
      - run: node scripts/f07-postgres.mjs
      - run: node scripts/f08-postgres.mjs
      - run: node scripts/f09-postgres.mjs
      - run: node scripts/ga01-postgres.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: product/agent/go.mod
          cache-dependency-path: product/agent/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          rustflags: ''
      - run: npm ci
        working-directory: product/client
      - run: go test ./...
        working-directory: product/agent
      - name: Build the endpoint agent resource
        env:
          NEXO_AGENT_UPDATE_TRUST_KEYS_B64: ${{ vars.NEXO_AGENT_UPDATE_TRUST_KEYS_B64 }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and -not $env:NEXO_AGENT_UPDATE_TRUST_KEYS_B64) { throw 'Configure NEXO_AGENT_UPDATE_TRUST_KEYS_B64 before creating a tagged Windows release.' }
          $releaseVersion = '0.1.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $releaseVersion = $env:GITHUB_REF_NAME.Substring(1) }
          if ($releaseVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Windows release requires a canonical vX.Y.Z tag.' }
          New-Item -ItemType Directory -Force bin | Out-Null
          $trustFlags = @('-buildid=')
          if ($env:NEXO_AGENT_UPDATE_TRUST_KEYS_B64) { $trustFlags += "-X=nexo.local/agent/internal/updater.EmbeddedTrustKeysB64=$env:NEXO_AGENT_UPDATE_TRUST_KEYS_B64" }
          $agentFlags = $trustFlags + "-X=main.agentVersion=$releaseVersion"
          $agentLdflags = $agentFlags -join ' '
          $helperLdflags = $trustFlags -join ' '
          go build -trimpath "-ldflags=$agentLdflags" -o bin/nexo-agent.exe ./cmd/nexo-agent
          go build -trimpath "-ldflags=$helperLdflags" -o bin/nexo-agent-updater.exe ./cmd/nexo-agent-updater
        working-directory: product/agent
      - name: Build the Windows NSIS installer
        run: npm run tauri -- build
        working-directory: product/client
      - name: Install pinned OpenVPN Community test prerequisite
        shell: pwsh
        run: |
          choco install openvpn --version=2.7.9.1 --exact --yes --no-progress --package-parameters="/NoStartMenu"
          if ($LASTEXITCODE -ne 0) { throw "OpenVPN setup failed with exit code $LASTEXITCODE." }
          $openVpn = Join-Path $env:ProgramFiles 'OpenVPN\bin\openvpn.exe'
          if (-not (Test-Path -LiteralPath $openVpn -PathType Leaf)) { throw 'OpenVPN Community CLI was not installed at the expected path.' }
          $version = & $openVpn --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^OpenVPN 2\.7\.9') { throw "Unexpected OpenVPN version: $version" }
          Write-Output $version
      - name: Execute the installer integration test on the real Windows runner
        shell: pwsh
        run: |
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'windows-latest runner must run this installer integration test elevated.' }
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'product/client/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -LiteralPath $installerDir -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in $installerDir" }
          Write-Output 'Executing scripts/l07-installer-test.ps1 on windows-latest'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/l07-installer-test.ps1') -InstallerPath $installer.FullName -Elevated
      - name: Assert installer integration result
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'nexo-l07-installer-result.json'
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) { throw 'l07-installer-test.ps1 did not write its result file.' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          foreach ($property in @('nsis_install', 'installed_ui', 'scm_restart', 'ipc_after_ui_close', 'nsis_uninstall', 'identity_preserved')) {
            if ($result.$property -ne 'PASS') { throw "Installer integration assertion failed: $property" }
          }
          Write-Output ('l07-installer-test.ps1 PASS: ' + ($result | ConvertTo-Json -Compress))
      - name: Stage tagged Windows artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory -Force release/windows | Out-Null
          Copy-Item product/agent/bin/nexo-agent.exe release/windows/nexo-agent.exe
          Copy-Item product/agent/bin/nexo-agent-updater.exe release/windows/nexo-agent-updater.exe
          $installer = Get-ChildItem product/client/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No se encontró el instalador NSIS generado.' }
          Copy-Item $installer.FullName release/windows/nexo-endpoint-installer.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nexo-windows
          path: release/windows/
          if-no-files-found: error

  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
      - name: Install Terraform 1.13.2 and verify its official checksum
        run: |
          set -euo pipefail
          version="$(node -p "require('./infra/toolchain.json').terraform.version")"
          url="$(node -p "require('./infra/toolchain.json').terraform.url")"
          checksum="$(node -p "require('./infra/toolchain.json').terraform.sha256")"
          archive="$RUNNER_TEMP/terraform_${version}_linux_amd64.zip"
          curl -fsSL "$url" -o "$archive"
          echo "$checksum  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/terraform-bin"
          unzip -oq "$archive" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"
      - name: Prepare an isolated Terraform workspace with its provider lock
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/nexo-terraform-lab"
          mkdir -p "$lab"
          cp -a "$GITHUB_WORKSPACE/infra/aws/lab/." "$lab/"
      - run: terraform fmt -check -recursive
        working-directory: ${{ runner.temp }}/nexo-terraform-lab
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: ${{ runner.temp }}/nexo-terraform-lab
      - run: terraform validate -no-color
        working-directory: ${{ runner.temp }}/nexo-terraform-lab
      - name: Run mock-provider plans only (no AWS credentials or apply)
        run: terraform test -no-color
        working-directory: ${{ runner.temp }}/nexo-terraform-lab

  attest-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, postgres, windows, iac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nexo-source
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nexo-windows
          path: release
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: release/nexo-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write commit-linked manifest and SHA-256 checksums
        run: |
          node scripts/release-manifest.mjs release
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release/SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexo-${{ github.ref_name }}-attested
          path: release/
          if-no-files-found: error
