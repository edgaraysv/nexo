[package]
name = "nexo-client"
version = "0.1.0"
description = "NEXO endpoint client for Windows"
edition = "2024"

[lib]
name = "nexo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
